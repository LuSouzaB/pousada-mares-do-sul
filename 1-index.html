<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Agente Marés do Sul Pousada</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f1ea;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }

  .app {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 16px;
    border: 1px solid #e4e0d6;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    height: 640px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }
  .header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid #ececec;
    background: #fff;
  }
  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #fff;
    border: 1px solid #ececec;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .avatar img { width: 100%; height: 100%; object-fit: contain; }
  .header .name { font-weight: 600; font-size: 14px; color: #222; }
  .header .status { font-size: 12px; color: #6a9e5c; }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #faf9f6;
  }
  .msg { max-width: 78%; padding: 9px 13px; border-radius: 16px; font-size: 13.5px; line-height: 1.45; }
  .msg.user { align-self: flex-end; background: #222; color: #fff; border-bottom-right-radius: 4px; }
  .msg.bot { align-self: flex-start; background: #eee7db; color: #222; border-bottom-left-radius: 4px; }
  .msg.typing { align-self: flex-start; background: #eee7db; color: #888; font-style: italic; }
  .inputbar {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid #ececec;
    background: #fff;
  }
  .inputbar input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 20px;
    padding: 9px 14px;
    font-size: 13.5px;
    outline: none;
  }
  .inputbar input:focus { border-color: #d85a30; }
  .inputbar button {
    background: #d85a30;
    color: #fff;
    border: none;
    border-radius: 20px;
    padding: 0 18px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .inputbar button:disabled { opacity: 0.5; cursor: default; }
  .note { max-width: 420px; margin: 12px auto 0; font-size: 11.5px; color: #999; text-align: center; }
  .social-links { display: flex; gap: 8px; margin-left: auto; }
  .social-links a {
    width: 30px; height: 30px; border-radius: 50%;
    background: #f4ede4; display: flex; align-items: center; justify-content: center;
    color: #d85a30; text-decoration: none; flex-shrink: 0;
  }
  .social-links a:hover { background: #eee1d3; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; background: #faf9f6; }
  .suggestion-chip {
    background: #fff;
    border: 1px solid #e4c9bc;
    color: #d85a30;
    font-size: 12px;
    padding: 6px 12px;
    border-radius: 14px;
    cursor: pointer;
  }
  .suggestion-chip:hover { background: #fdf1ec; }
</style>
</head>

<p class="note">Protótipo de teste — respostas geradas com base nas informações reais do site da pousada</p>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

let history = [];

function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text) return;
  inputEl.value = '';
  sendBtn.disabled = true;
  addMessage(text, 'user');
  history.push({ role: 'user', content: text });

  const typingDiv = addMessage('digitando...', 'typing bot');

  try {
    const response = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history })
    });
    const rawText = await response.text();
    let data;
    try {
      data = JSON.parse(rawText);
    } catch (parseErr) {
      typingDiv.remove();
      addMessage('Erro: o servidor respondeu de forma inesperada (status ' + response.status + '). Confira o deployment na Vercel.', 'bot');
      console.error('Resposta não era JSON:', rawText);
      return;
    }
    if (!response.ok) {
      typingDiv.remove();
      addMessage('Erro: ' + (data.error || 'não consegui conectar com o assistente.'), 'bot');
      console.error(data);
      return;
    }
    const reply = (data.content || []).filter(b => b.type === 'text').map(b => b.text).join('\n') || 'Desculpe, não consegui responder agora.';
    typingDiv.remove();
    addMessage(reply, 'bot');
    history.push({ role: 'assistant', content: reply });
  } catch (err) {
    typingDiv.remove();
    addMessage('Erro de rede ao conectar. Verifique sua internet e tente novamente.', 'bot');
    console.error(err);
  } finally {
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

sendBtn.addEventListener('click', sendMessage);
inputEl.addEventListener('keydown', (e) => { if (e.key === 'Enter') sendMessage(); });

const suggestionsEl = document.getElementById('suggestions');
suggestionsEl.querySelectorAll('.suggestion-chip').forEach(btn => {
  btn.addEventListener('click', () => {
    inputEl.value = btn.dataset.q;
    suggestionsEl.style.display = 'none';
    sendMessage();
  });
});
</script>
