<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agente Marés do Sul Pousada</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f4f1ea;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 32px 16px;
}

.app {
  width: 100%;
  max-width: 420px;
  background: #ffffff;
  border-radius: 16px;
  border: 1px solid #e4e0d6;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  height: 640px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.06);
}

.header {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid #ececec;
  background: #fff;
}

.header .name {
  font-weight: 600;
  font-size: 14px;
  color: #222;
}

.header .status {
  font-size: 12px;
  color: #6a9e5c;
}

.social-links {
  display: flex;
  gap: 8px;
  margin-left: auto;
}

.social-links a {
  text-decoration: none;
  font-size: 18px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  background: #faf9f6;
}

.msg {
  max-width: 78%;
  padding: 9px 13px;
  border-radius: 16px;
  font-size: 13.5px;
  line-height: 1.45;
}

.msg.user {
  align-self: flex-end;
  background: #222;
  color: #fff;
  border-bottom-right-radius: 4px;
}

.msg.bot {
  align-self: flex-start;
  background: #eee7db;
  color: #222;
  border-bottom-left-radius: 4px;
}

.msg.typing {
  align-self: flex-start;
  background: #eee7db;
  color: #888;
  font-style: italic;
}

.suggestions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  padding: 0 16px 12px;
  background: #faf9f6;
}

.suggestion-chip {
  background: #fff;
  border: 1px solid #e4c9bc;
  color: #d85a30;
  font-size: 12px;
  padding: 6px 12px;
  border-radius: 14px;
  cursor: pointer;
}

.inputbar {
  display: flex;
  gap: 8px;
  padding: 12px;
  border-top: 1px solid #ececec;
  background: #fff;
}

.inputbar input {
  flex: 1;
  border: 1px solid #ddd;
  border-radius: 20px;
  padding: 9px 14px;
  font-size: 13.5px;
  outline: none;
}

.inputbar input:focus {
  border-color: #d85a30;
}

.inputbar button {
  background: #d85a30;
  color: #fff;
  border: none;
  border-radius: 20px;
  padding: 0 18px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

.inputbar button:disabled {
  opacity: 0.5;
}

.note {
  max-width: 420px;
  margin: 12px auto 0;
  font-size: 11.5px;
  color: #999;
  text-align: center;
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div>
      <div class="name">Marés do Sul Pousada</div>
      <div class="status">Agente de teste · online</div>
    </div>

    <div class="social-links">
      <a href="https://api.whatsapp.com/send?1=pt_BR&phone=554833541921" target="_blank">💬</a>
      <a href="https://www.instagram.com/maresdosulpousada/" target="_blank">📷</a>
      <a href="https://www.maresdosulpousada.com.br/" target="_blank">🌐</a>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg bot">
      Oi! Que bom te ver por aqui 😊 Sou o assistente virtual da Pousada Marés do Sul. Como posso te ajudar — está pensando em uma viagem para Garopaba?
    </div>
  </div>

  <div class="suggestions" id="suggestions">
    <button class="suggestion-chip" data-q="Quero conhecer a pousada">Quero conhecer a pousada</button>
    <button class="suggestion-chip" data-q="O que a pousada oferece?">O que a pousada oferece?</button>
    <button class="suggestion-chip" data-q="A praia fica perto?">A praia fica perto?</button>
    <button class="suggestion-chip" data-q="Como faço para reservar?">Como reservar</button>
    <button class="suggestion-chip" data-q="Qual a localização da pousada?">Localização</button>
  </div>

  <div class="inputbar">
    <input type="text" id="input" placeholder="Escreva sua pergunta...">
    <button id="send">Enviar</button>
  </div>

</div>

<p class="note">
  Protótipo de teste — respostas geradas com base nas informações reais do site da pousada
</p>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send');

let history = [];

function addMessage(text, cls) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

async function sendMessage() {
  const text = inputEl.value.trim();

  if (!text) return;

  inputEl.value = '';
  sendBtn.disabled = true;

  addMessage(text, 'user');

  history.push({
    role: 'user',
    content: text
  });

  const typingDiv = addMessage('digitando...', 'typing bot');

  try {

    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        messages: history
      })
    });

    const data = await response.json();

    typingDiv.remove();

    if (!response.ok) {
      console.error(data);

      let errorMessage = 'Não consegui conectar com o assistente.';

      if (typeof data.error === 'string') {
        errorMessage = data.error;
      } else if (data.error?.message) {
        errorMessage = data.error.message;
      }

      addMessage('Erro: ' + errorMessage, 'bot');
      return;
    }

    const reply =
      data.choices?.[0]?.message?.content ||
      'Desculpe, não consegui responder agora.';

    addMessage(reply, 'bot');

    history.push({
      role: 'assistant',
      content: reply
    });

  } catch (error) {

    typingDiv.remove();

    console.error(error);

    addMessage(
      'Erro de rede ao conectar. Tente novamente.',
      'bot'
    );

  } finally {

    sendBtn.disabled = false;
    inputEl.focus();

  }
}

sendBtn.addEventListener('click', sendMessage);

inputEl.addEventListener('keydown', function(event) {
  if (event.key === 'Enter') {
    sendMessage();
  }
});

document.querySelectorAll('.suggestion-chip').forEach(button => {
  button.addEventListener('click', function() {
    inputEl.value = this.dataset.q;
    sendMessage();
  });
});
</script>

</body>
</html>
